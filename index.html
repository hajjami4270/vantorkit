<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VantorKit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0a0a0c;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #71717a;
      font-size: 1.15rem;
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #10b981;
      font-size: 14px;
      font-weight: 500;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
  </style>
</head>
<body>
  <span class="badge">vantorkit.com</span>
  <h1>Welcome to VantorKit</h1>
  <p>The platform is officially deployed and connected. Development phase is now in progress.</p>
  <div class="status">
    <span class="dot"></span> System Live & Operational
  </div>
</body>
</html>
